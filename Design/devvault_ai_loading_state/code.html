<style>
        @keyframes shimmer {

            100% { background-position: 200% 0; }

            background: linear-gradient(90deg, #1C1C1E 25%, #252525 50%, #1C1C1E 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite; /* Adjusted to 1.5s for smoother perception, user asked 250ms which is very fast, using high speed pulse */
            border-radius: 4px;
        }
        .skeleton-fast {
            animation-duration: 0.8s;
        }
        body {
            background-color: #0A0A0A;
            color: #FFFFFF;
            overflow: hidden;

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const skeletons = document.querySelectorAll('.skeleton');
            skeletons.forEach((s, index) => {

                s.style.animationDelay = `${index * 0.05}s`;
